<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Block Flight (experimental)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9eaec; font: 13px/1.4 system-ui, sans-serif; color: #333; }
    canvas { touch-action: none; display: block; width: 100vw; height: 100vh; cursor: default; }
    #trialInfo { position: fixed; top: 10px; left: 14px; font-size: 14px; font-weight: 600; }
    #hintBar { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); background: rgba(255,255,255,.92); border: 1px solid #ccd; border-radius: 10px; padding: 8px 18px; font-size: 16px; color: #2b2f36; z-index: 20; }
    #dl { position: fixed; bottom: 8px; right: 8px; font-size: 11px; opacity: .45; z-index: 60; }
    #dl button { font: inherit; padding: 1px 6px; background: none; border: 1px solid #aab; border-radius: 4px; color: #445; cursor: pointer; }
    #dl button:hover { opacity: 1; }
    body.kiosk #dl { display: none; }
    #screen { position: fixed; inset: 0; background: #e9eaec; display: flex; align-items: center; justify-content: center; z-index: 50; }
    #screen.hidden, .hidden { display: none !important; }
    #card, #endBox { max-width: 560px; background: #fff; border: 1px solid #ccd; border-radius: 12px; padding: 28px 34px; text-align: left; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    #card h2, #endBox h2 { margin: 0 0 12px; font-size: 22px; color: #2b2f36; }
    #card p, #endBox p { margin: 0 0 18px; font-size: 17px; line-height: 1.5; color: #333; white-space: pre-line; }
    #card button, #endBox button { font: inherit; font-size: 16px; padding: 8px 22px; border-radius: 8px; border: 1px solid #5b6b8c; background: #3d5a99; color: #fff; cursor: pointer; margin-right: 8px; }
    #endBox button.secondary, #card button.secondary { background: #fff; color: #3d5a99; border: 2px solid #3d5a99; }
    #cardButtons { display: flex; gap: 10px; align-items: center; }
    #cardButtons button { margin-right: 0; min-width: 110px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="trialInfo" class="hidden"></div>
  <div id="hintBar" class="hidden"></div>
  <div id="screen" class="hidden">
    <div id="card" class="hidden"><h2 id="cardTitle"></h2><p id="cardText"></p><div id="cardButtons"><button id="cardBack" class="secondary hidden">Back</button><button id="cardBtn">Continue</button></div></div>
    <div id="endBox" class="hidden"><h2>All done - thank you!</h2><p id="endText">You have finished the game. Please click "Download data" and send the downloaded file to the researcher. Thank you for taking part!</p><button id="endJson">Download data</button><button id="endCsv" class="secondary">Trials CSV</button></div>
  </div>
  <div id="dl"><button id="dlJson" title="Download the data collected in this browser session">Download data</button> <button id="dlCsv">Trials CSV</button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
